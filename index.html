<!DOCTYPE html>
<html>
<head>
    <title>Monopoly Math Kelas 6</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #e0f7fa; }
        #board { display: flex; justify-content: center; margin-top: 50px; gap: 10px; flex-wrap: wrap; }
        .tile { width: 100px; height: 100px; border: 3px solid #333; display: flex; align-items: center; 
                justify-content: center; background: white; position: relative; font-weight: bold; font-size: 12px; }
        .active { background-color: #ffe082; border-color: #ffb300; }
        #player { font-size: 30px; position: absolute; bottom: 5px; transition: all 0.3s; }
        #controls { margin-top: 30px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #2e7d32; color: white; border: none; border-radius: 8px; }
        .status { margin-top: 20px; font-size: 20px; color: #1565c0; }
    </style>
</head>
<body>

    <h1>📐 Math Monopoly: Kelas 6</h1>
    
    <div id="board">
        <div class="tile" id="t0">START<div id="player">🏃</div></div>
        <div class="tile" id="t1">Materi: Bil. Bulat</div>
        <div class="tile" id="t2">Materi: Lingkaran</div>
        <div class="tile" id="t3">ZONK!</div>
        <div class="tile" id="t4">Materi: Kubus</div>
        <div class="tile" id="t5">Materi: Statistika</div>
        <div class="tile" id="t6">FINISH 🏆</div>
    </div>

    <div id="controls">
        <button onclick="kocokDadu()">Kocok Dadu 🎲</button>
        <p class="status" id="notif">Selamat Datang! Ayo main.</p>
    </div>

    <script>
        let posisi = 0;
        const totalPetak = 7;

        // Daftar soal matematika kelas 6
        const bankSoal = [
            {}, // Start kosong
            { tanya: "Berapa hasil dari -15 + 20?", jawab: 5 },
            { tanya: "Jari-jari lingkaran 7 cm, berapa Luasnya? (pakai 22/7)", jawab: 154 },
            { tanya: "Kamu mendarat di petak ZONK! 10 - 10 = ?", jawab: 0 },
            { tanya: "Volume kubus dengan rusuk 5 cm adalah...", jawab: 125 },
            { tanya: "Rata-rata dari nilai 7, 8, 9 adalah...", jawab: 8 }
        ];

        function kocokDadu() {
            let dadu = Math.floor(Math.random() * 3) + 1; // Dadu 1-3
            posisi += dadu;

            if (posisi >= totalPetak - 1) {
                posisi = totalPetak - 1;
                pindahPemain();
                document.getElementById("notif").innerHTML = "HORE! Kamu sampai di Finish! 🎉";
                return;
            }

            pindahPemain();
            setTimeout(() => beriSoal(posisi), 500);
        }

        function pindahPemain() {
            const petakTujuan = document.getElementById("t" + posisi);
            const player = document.getElementById("player");
            petakTujuan.appendChild(player);
        }

        function beriSoal(index) {
            let soal = bankSoal[index];
            let jawabanUser = prompt(soal.tanya);

            if (jawabanUser == soal.jawab) {
                alert("BENAR! Kamu aman di petak ini.");
                document.getElementById("notif").innerHTML = "Jawaban Benar! Lanjut kocok dadu.";
            } else {
                alert("SALAH! Kamu harus kembali ke petak sebelumnya.");
                posisi -= 1;
                if(posisi < 0) posisi = 0;
                pindahPemain();
                document.getElementById("notif").innerHTML = "Yah salah, mundur 1 langkah.";
            }
        }
    </script>
</body>
</html>
